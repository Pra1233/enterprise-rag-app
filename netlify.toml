[build]
  base = "frontend"
  # public/env-config.js is checked in with a localhost dev default, meant
  # to be overwritten at container startup by the Docker entrypoint's
  # envsubst (see deployment/docker/frontend.Dockerfile) - Netlify has no
  # such entrypoint, so without this it silently wins over the correct
  # build-time value below (src/config.ts checks window.__ENV__ FIRST).
  # Regenerate it here, the same way, before Vite copies public/ into dist/.
  command = "echo \"window.__ENV__ = { VITE_API_BASE_URL: '$VITE_API_BASE_URL' };\" > public/env-config.js && npm run build"
  publish = "dist"

[build.environment]
  # No Docker entrypoint on Netlify to inject window.__ENV__ at runtime (see
  # src/config.ts) - this gets baked in at build time instead, which is fine
  # since a static Netlify deploy only ever points at one backend anyway.
  VITE_API_BASE_URL = "https://enterprise-rag-api-a5d5.onrender.com/api/v1"

# React Router does client-side routing - a direct load/refresh of e.g.
# /chat or /admin must still serve index.html (not a Netlify 404), so the
# app's own router can take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
