services:
  # Render's free tier only covers Web Services (a Background Worker needs a
  # paid plan, ~$6-7/mo minimum). Running the Celery worker as a second
  # process *inside* this container (backgrounded alongside uvicorn) was
  # tried and measured against the real free-tier instance: two heavy
  # Python processes (torch/transformers/langchain each) exceeded the
  # 512MB free instance's memory/startup-time budget and never bound a
  # port within Render's scan window. Ingestion instead runs synchronously
  # in the request via Celery's eager mode (CELERY_TASK_ALWAYS_EAGER below)
  # - no second process, no broker round-trip, just a slower upload
  # response. Local dev keeps the real async Celery+Redis pipeline.
  - type: web
    name: enterprise-rag-api
    runtime: docker
    dockerfilePath: ./deployment/docker/backend.Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_PREFIX
        value: /api/v1
      - key: PORT
        value: "8000"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-base
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: QDRANT_COLLECTION
        value: enterprise_rag_chunks
      - key: MINIO_BUCKET
        value: rag-chatbot12
      - key: MINIO_SECURE
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL
        value: "86400"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: EVALUATION_ENABLED
        value: "true"
      - key: EVALUATION_DATASET_PATH
        value: src/evaluation/datasets/sample_dataset.json
      - key: EVALUATION_TOP_K
        value: "5"
      - key: EVALUATION_MAX_CONCURRENCY
        value: "2"
      - key: METRICS_ENABLED
        value: "true"
      # Secrets and deployment-specific values — set these manually in the
      # Render dashboard after the service is created (never committed here).
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
