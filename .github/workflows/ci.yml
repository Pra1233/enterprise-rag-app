name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff check)
        run: ruff check src/ tests/ alembic/

      - name: Formatting check (ruff format)
        run: ruff format --check src/ tests/ alembic/

      # Full static type-checking (mypy) isn't configured for this project
      # yet — "where configured" per the deployment spec. ruff's "UP"/"F"
      # rulesets above catch a meaningful subset of type-adjacent issues
      # (unused imports, obvious signature mistakes) in the meantime.

      - name: Unit tests
        env:
          # tests/conftest.py already provides safe defaults for these (a
          # SQLite file DB, dummy Groq/JWT values) — everything here is
          # self-contained and mocks all external services (Groq, Qdrant,
          # MinIO, Redis), so no live infrastructure is needed for this job.
          GROQ_API_KEY: test-ci-key
          JWT_SECRET_KEY: test-ci-secret-at-least-32-bytes-long
        run: pytest tests/ -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Production build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  docker:
    name: Docker build + scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: deployment/docker/backend.Dockerfile
          push: false
          load: true
          tags: rag-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/frontend.Dockerfile
          push: false
          load: true
          tags: rag-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify images were created
        run: |
          docker image inspect rag-backend:ci
          docker image inspect rag-frontend:ci

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: rag-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only for now; flip to "1" once a baseline is established

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: rag-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
