upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Backend API (incl. SSE streaming for /api/v1/chat) ---
    location /api/ {
        proxy_pass http://backend_api/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Required for SSE: nginx must not buffer the response or the client
        # won't see tokens until the whole answer is generated. Also disables
        # response caching and raises the read timeout well past a single
        # LLM generation (the chat SSE route's own heartbeat keeps the
        # connection alive during long generations — see
        # src/api/routes/chat.py HEARTBEAT_INTERVAL_SECONDS).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
    }

    # --- Static assets (Vite's hashed filenames — safe to cache forever) ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Runtime config: must always be fresh, never long-cached ---
    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- SPA fallback: unknown paths resolve to index.html for client-side routing ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
